<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1a1a24;
  --border: #2a2a3a;
  --text: #e8e8f0;
  --text-muted: #8888a0;
  --whatsapp: #25D366;
  --whatsapp-bg: rgba(37,211,102,0.08);
  --linkedin: #0A66C2;
  --linkedin-bg: rgba(10,102,194,0.08);
  --instagram: #E1306C;
  --instagram-bg: rgba(225,48,108,0.08);
  --discord: #5865F2;
  --discord-bg: rgba(88,101,242,0.08);
  --form: #F5A623;
  --form-bg: rgba(245,166,35,0.08);
  --accent: #a78bfa;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.header {
  padding: 40px 32px 24px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #12121a 0%, var(--bg) 100%);
}

.header h1 {
  font-family: 'Space Mono', monospace;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}

.header h1 span { color: var(--accent); }

.header p { color: var(--text-muted); font-size: 14px; }

.stats-bar {
  display: flex;
  gap: 12px;
  padding: 20px 32px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
}

.stat-card {
  flex-shrink: 0;
  padding: 14px 20px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  min-width: 120px;
  cursor: pointer;
  transition: all 0.2s;
}

.stat-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.stat-card.active { border-color: var(--accent); background: rgba(167,139,250,0.06); }

.stat-card .num {
  font-family: 'Space Mono', monospace;
  font-size: 24px;
  font-weight: 700;
}

.stat-card .label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 4px;
}

.stat-whatsapp .num { color: var(--whatsapp); }
.stat-linkedin .num { color: var(--linkedin); }
.stat-instagram .num { color: var(--instagram); }
.stat-discord .num { color: var(--discord); }
.stat-form .num { color: var(--form); }
.stat-total .num { color: var(--accent); }

.filters {
  display: flex;
  gap: 8px;
  padding: 16px 32px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.filter-btn:hover { border-color: var(--text-muted); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

.filter-btn .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.search-box {
  margin-left: auto;
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  outline: none;
  width: 220px;
  transition: border-color 0.2s;
}

.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--text-muted); }

.sections { padding: 8px 32px 60px; }

.section {
  margin-top: 28px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.section-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
}

.section-header h2 {
  font-size: 16px;
  font-weight: 600;
}

.section-header .count {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  margin-left: auto;
}

.group-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  margin: 20px 0 10px;
  padding-left: 4px;
}

.contacts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 8px;
}

.contact-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all 0.2s;
  text-decoration: none;
  color: var(--text);
}

.contact-card:hover {
  border-color: var(--accent);
  background: var(--surface2);
  transform: translateX(3px);
}

.contact-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}

.contact-info { flex: 1; min-width: 0; }

.contact-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.contact-detail {
  font-size: 12px;
  color: var(--text-muted);
  font-family: 'Space Mono', monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.contact-group-badge {
  font-size: 10px;
  color: var(--text-muted);
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(255,255,255,0.04);
  white-space: nowrap;
}

.contact-action {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 16px;
  transition: transform 0.2s;
}

.contact-card:hover .contact-action { transform: scale(1.15); }

/* WhatsApp */
.wa .contact-avatar { background: var(--whatsapp-bg); color: var(--whatsapp); }
.wa .contact-action { background: var(--whatsapp-bg); color: var(--whatsapp); }
.wa:hover { border-color: var(--whatsapp); }
.wa .section-icon { background: var(--whatsapp-bg); color: var(--whatsapp); }

/* LinkedIn */
.li .contact-avatar { background: var(--linkedin-bg); color: var(--linkedin); }
.li .contact-action { background: var(--linkedin-bg); color: var(--linkedin); }
.li:hover { border-color: var(--linkedin); }

/* Instagram */
.ig .contact-avatar { background: var(--instagram-bg); color: var(--instagram); }
.ig .contact-action { background: var(--instagram-bg); color: var(--instagram); }
.ig:hover { border-color: var(--instagram); }

/* Discord */
.dc .contact-avatar { background: var(--discord-bg); color: var(--discord); }
.dc .contact-action { background: var(--discord-bg); color: var(--discord); }
.dc:hover { border-color: var(--discord); }

/* Formulário */
.fm .contact-avatar { background: var(--form-bg); color: var(--form); }
.fm .contact-action { background: var(--form-bg); color: var(--form); }
.fm:hover { border-color: var(--form); }

.hidden { display: none !important; }

@media (max-width: 600px) {
  .header { padding: 24px 16px 16px; }
  .stats-bar { padding: 16px; }
  .filters { padding: 12px 16px; }
  .sections { padding: 8px 16px 40px; }
  .contacts-grid { grid-template-columns: 1fr; }
  .search-box { width: 100%; margin-left: 0; margin-top: 8px; }
  .filters { flex-direction: column; align-items: stretch; }
}
</style>

function getInitials(name) {
  return name.replace(/[~</>✌🤘😎]/g, '').trim().split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

function cleanPhone(phone) {
  return phone.replace(/[^\d+]/g, '');
}

function formatPhone(phone) {
  const clean = cleanPhone(phone);
  if (clean.length >= 12) {
    const cc = clean.slice(0, 2);
    const ddd = clean.slice(2, 4);
    const rest = clean.slice(4);
    return `+${cc} ${ddd} ${rest}`;
  }
  return phone;
}

function render() {

function filterBy(channel) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.stat-card').forEach(b => b.classList.remove('active'));

  if (channel === 'all') {
    document.querySelector('[data-filter="all"]').classList.add('active');
    document.querySelector('.stat-total').classList.add('active');
  } else {
    document.querySelector(`[data-filter="${channel}"]`).classList.add('active');
    document.querySelector(`.stat-${channel === 'form' ? 'form' : channel}`).classList.add('active');
  }

  document.querySelectorAll('.section').forEach(s => {
    if (channel === 'all') {
      s.classList.remove('hidden');
    } else {
      s.classList.toggle('hidden', s.dataset.channel !== channel);
    }
  });
}

function searchContacts(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.contact-card').forEach(card => {
    if (!q) {
      card.classList.remove('hidden');
    } else {
      const name = card.dataset.name || '';
      const detail = card.dataset.detail || '';
      card.classList.toggle('hidden', !name.includes(q) && !detail.includes(q));
    }
  });
}
