<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06080c;
  --surface: #0d1117;
  --surface2: #151b24;
  --surface3: #1c2431;
  --border: #21293a;
  --border2: #2d3a4f;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #64748b;
  --wa: #22c55e;
  --wa-bg: rgba(34,197,94,.08);
  --li: #3b82f6;
  --li-bg: rgba(59,130,246,.08);
  --ig: #ec4899;
  --ig-bg: rgba(236,72,153,.08);
  --dc: #8b5cf6;
  --dc-bg: rgba(139,92,246,.08);
  --fm: #f59e0b;
  --fm-bg: rgba(245,158,11,.08);
  --accent: #06b6d4;
  --accent-bg: rgba(6,182,212,.08);
  --success: #22c55e;
  --warn: #f59e0b;
  --danger: #ef4444;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--surface); }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

/* HEADER */
.hdr { padding:28px 28px 20px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,#0a0f16,var(--bg)); position:sticky; top:0; z-index:100; }
.hdr-top { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.hdr h1 { font-size:22px; font-weight:700; letter-spacing:-.3px; }
.hdr h1 span { color:var(--accent); }
.hdr-actions { display:flex; gap:8px; }
.btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:6px; }
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn-primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
.btn-primary:hover { opacity:.85; }
.btn-sm { padding:5px 10px; font-size:11px; }

/* STATS */
.stats { display:flex; gap:8px; padding:16px 28px; overflow-x:auto; border-bottom:1px solid var(--border); }
.st { flex-shrink:0; padding:12px 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface); cursor:pointer; transition:all .15s; min-width:100px; }
.st:hover { border-color:var(--accent); }
.st.active { border-color:var(--accent); background:var(--accent-bg); }
.st-n { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; }
.st-l { font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:1.2px; margin-top:2px; }

/* FILTERS */
.filters { display:flex; gap:6px; padding:14px 28px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--border); }
.pill { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text3); font-family:'Outfit',sans-serif; font-size:12px; cursor:pointer; transition:all .15s; }
.pill:hover { border-color:var(--text2); color:var(--text2); }
.pill.on { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
.pill .d { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
.search { margin-left:auto; padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:'Outfit',sans-serif; font-size:12px; outline:none; width:200px; }
.search:focus { border-color:var(--accent); }
.search::placeholder { color:var(--text3); }
.pill-group { display:flex; gap:6px; flex-wrap:wrap; }
.sep { width:1px; height:24px; background:var(--border); margin:0 6px; flex-shrink:0; }
.pill-status { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text3); font-family:'Outfit',sans-serif; font-size:12px; cursor:pointer; transition:all .15s; }
.pill-status:hover { border-color:var(--text2); color:var(--text2); }
.pill-status.on { background:var(--surface3); color:var(--text); border-color:var(--border2); font-weight:500; }

/* TABLE */
.tbl-wrap { overflow-x:auto; padding:0 28px 80px; }
table { width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
thead th { position:sticky; top:0; background:var(--surface); padding:10px 12px; text-align:left; font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:.8px; border-bottom:1px solid var(--border); white-space:nowrap; z-index:10; }
tbody tr { border-bottom:1px solid var(--border); transition:background .1s; cursor:pointer; }
tbody tr:hover { background:var(--surface2); }
tbody td { padding:10px 12px; vertical-align:top; max-width:200px; }
.name-cell { display:flex; align-items:center; gap:8px; }
.av { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
.nm { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; }
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; white-space:nowrap; }
.b-wa { background:var(--wa-bg); color:var(--wa); }
.b-li { background:var(--li-bg); color:var(--li); }
.b-ig { background:var(--ig-bg); color:var(--ig); }
.b-dc { background:var(--dc-bg); color:var(--dc); }
.b-fm { background:var(--fm-bg); color:var(--fm); }
.link-btn { padding:4px 10px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--accent); font-size:11px; font-family:'Outfit',sans-serif; cursor:pointer; text-decoration:none; transition:all .15s; white-space:nowrap; }
.link-btn:hover { background:var(--accent-bg); border-color:var(--accent); }
.status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
.s-pending { background:var(--text3); }
.s-contacted { background:var(--warn); }
.s-replied { background:var(--accent); }
.s-tested { background:var(--success); }
.s-feedback { background:#a855f7; }
.grp-badge { font-size:10px; color:var(--text3); background:rgba(255,255,255,.03); padding:2px 6px; border-radius:6px; white-space:nowrap; }
.check { width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
.ct-mono { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text2); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* MODAL */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200; backdrop-filter:blur(4px); justify-content:center; align-items:flex-start; padding:40px 20px; overflow-y:auto; }
.overlay.open { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:680px; overflow:hidden; animation:slideUp .25s ease; }
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.modal-hdr { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-hdr h2 { font-size:18px; font-weight:600; }
.close-btn { background:none; border:none; color:var(--text3); font-size:20px; cursor:pointer; padding:4px; }
.close-btn:hover { color:var(--text); }
.modal-body { padding:24px; max-height:70vh; overflow-y:auto; }
.field { margin-bottom:18px; }
.field label { display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
.field label small { font-weight:400; color:var(--text3); text-transform:none; letter-spacing:0; }
.field textarea, .field input, .field select { width:100%; padding:10px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-family:'Outfit',sans-serif; font-size:13px; outline:none; transition:border-color .15s; }
.field textarea:focus, .field input:focus, .field select:focus { border-color:var(--accent); }
.field textarea { resize:vertical; min-height:70px; }
.field select { cursor:pointer; }
.field-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
.info-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; padding:14px; background:var(--surface2); border-radius:10px; border:1px solid var(--border); }
.info-item { font-size:12px; color:var(--text2); }
.info-item strong { color:var(--text); }

/* RESPONSIVE */
@media (max-width:768px) {
  .hdr,.stats,.filters,.tbl-wrap { padding-left:14px; padding-right:14px; }
  .search { width:100%; margin-left:0; margin-top:6px; }
  .filters { flex-direction:column; align-items:stretch; }
  .field-row { grid-template-columns:1fr; }
  .hdr-top { flex-direction:column; align-items:flex-start; }
}

.empty { text-align:center; padding:60px 20px; color:var(--text3); }
.empty span { font-size:40px; display:block; margin-bottom:12px; }
.progress-bar { height:4px; background:var(--surface3); border-radius:2px; overflow:hidden; width:100%; }
.progress-fill { height:100%; border-radius:2px; transition:width .3s; }
</style>
</head>

// FEEDBACK STATE (in-memory, exportable)

let feedbacks = {};
try { feedbacks = JSON.parse(localStorage.getItem('lumyf_fb') || '{}'); } catch(e) { feedbacks = {}; }
function save() { localStorage.setItem('lumyf_fb', JSON.stringify(feedbacks)); }
function getFb(id) { return feedbacks[id] || {status:'Pendente',replied:false,q1:'',q2:'',q3:'',exp:'',q5:'',q6:'',q7:'',q8:'',q9:'',nps:'',sat:'',obs:''}; }

const channels = ['WhatsApp','LinkedIn','Instagram','Discord','Formulário'];
const chClass = {WhatsApp:'wa',LinkedIn:'li',Instagram:'ig',Discord:'dc','Formulário':'fm'};
const statuses = ['Pendente','Contatado','Respondeu','Testou','Feedback completo'];
const statusClass = {Pendente:'s-pending',Contatado:'s-contacted',Respondeu:'s-replied',Testou:'s-tested','Feedback completo':'s-feedback'};
let filterCh = 'all';
let filterSt = 'all';

function init(ch) { return ch.replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,2).toUpperCase(); }
function getInitials(n) { return n.replace(/[~</>✌🤘😎()]/g,'').trim().split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function countByChannel(ch) { return ch==='all'?contacts.length:contacts.filter(c=>c.ch===ch).length; }
function countByStatus(st) {
  if(st==='all') return contacts.length;
  return contacts.filter(c=>getFb(c.id).status===st).length;
}
function countReplied() { return contacts.filter(c=>getFb(c.id).replied).length; }
function feedbackProgress(id) {
  const f=getFb(id);
  let filled=0, total=9;
  if(f.q1) filled++; if(f.q2) filled++; if(f.q3) filled++;
  if(f.exp&&f.exp!=='') filled++; if(f.q5) filled++;
  if(f.q6) filled++; if(f.q7) filled++; if(f.q8) filled++; if(f.q9) filled++;
  return Math.round((filled/total)*100);
}

function renderStats() {
  const replied = countReplied();
  const pct = Math.round((replied/contacts.length)*100);
  document.getElementById('stats').innerHTML = `
    <div class="st ${filterCh==='all'?'active':''}" onclick="setCh('all')"><div class="st-n" style="color:var(--accent)">${contacts.length}</div><div class="st-l">Total</div></div>
    <div class="st ${filterCh==='WhatsApp'?'active':''}" onclick="setCh('WhatsApp')"><div class="st-n" style="color:var(--wa)">${countByChannel('WhatsApp')}</div><div class="st-l">WhatsApp</div></div>
    <div class="st ${filterCh==='LinkedIn'?'active':''}" onclick="setCh('LinkedIn')"><div class="st-n" style="color:var(--li)">${countByChannel('LinkedIn')}</div><div class="st-l">LinkedIn</div></div>
    <div class="st ${filterCh==='Instagram'?'active':''}" onclick="setCh('Instagram')"><div class="st-n" style="color:var(--ig)">${countByChannel('Instagram')}</div><div class="st-l">Instagram</div></div>
    <div class="st ${filterCh==='Discord'?'active':''}" onclick="setCh('Discord')"><div class="st-n" style="color:var(--dc)">${countByChannel('Discord')}</div><div class="st-l">Discord</div></div>
    <div class="st ${filterCh==='Formulário'?'active':''}" onclick="setCh('Formulário')"><div class="st-n" style="color:var(--fm)">${countByChannel('Formulário')}</div><div class="st-l">Formulário</div></div>
    <div class="st"><div class="st-n" style="color:var(--success)">${replied}</div><div class="st-l">Responderam (${pct}%)</div></div>
  `;
}

function renderFilters() {
  let chHtml = `<button class="pill ${filterCh==='all'?'on':''}" onclick="setCh('all')">Todos</button>`;
  channels.forEach(ch => { chHtml += `<button class="pill ${filterCh===ch?'on':''}" onclick="setCh('${ch}')"><span class="d" style="background:var(--${chClass[ch]})"></span>${ch}</button>`; });
  document.getElementById('channelFilters').innerHTML = chHtml;

  let stHtml = `<button class="pill-status ${filterSt==='all'?'on':''}" onclick="setSt('all')">Todos status</button>`;
  statuses.forEach(st => { stHtml += `<button class="pill-status ${filterSt===st?'on':''}" onclick="setSt('${st}')">${st} (${countByStatus(st)})</button>`; });
  document.getElementById('statusFilters').innerHTML = stHtml;
}

function setCh(ch) { filterCh=ch; renderAll(); }
function setSt(st) { filterSt=st; renderAll(); }

function renderTable() {
  const q = (document.getElementById('searchBox').value||'').toLowerCase();
  let filtered = contacts.filter(c => {
    if(filterCh!=='all' && c.ch!==filterCh) return false;
    if(filterSt!=='all' && getFb(c.id).status!==filterSt) return false;
    if(q) {
      const s = (c.name+c.grp+c.ct+c.ch).toLowerCase();
      if(!s.includes(q)) return false;
    }
    return true;
  });

  if(filtered.length===0) {
    document.getElementById('tbody').innerHTML='';
    document.getElementById('emptyState').style.display='block';
    return;
  }
  document.getElementById('emptyState').style.display='none';

  document.getElementById('tbody').innerHTML = filtered.map(c => {
    const f = getFb(c.id);
    const cls = chClass[c.ch];
    const prog = feedbackProgress(c.id);
    const progColor = prog===0?'var(--text3)':prog<50?'var(--warn)':prog<100?'var(--accent)':'var(--success)';
    return `<tr onclick="openModal(${c.id})">
      <td><div class="name-cell"><div class="av" style="background:var(--${cls}-bg);color:var(--${cls})">${getInitials(c.name)}</div><span class="nm">${c.name}</span></div></td>
      <td><span class="badge b-${cls}">${c.ch}</span></td>
      <td><span class="grp-badge">${c.grp}</span></td>
      <td><span class="ct-mono">${c.ct}</span></td>
      <td><a class="link-btn" href="${c.link}" target="_blank" onclick="event.stopPropagation()">Abrir →</a></td>
      <td><span class="status-dot ${statusClass[f.status]||'s-pending'}"></span>${f.status}</td>
      <td><input type="checkbox" class="check" ${f.replied?'checked':''} onclick="event.stopPropagation();toggleReply(${c.id},this.checked)"></td>
      <td style="font-size:12px;color:var(--text2)">${f.exp||'—'}</td>
      <td style="font-family:'JetBrains Mono',monospace;font-size:12px">${f.nps||'—'}</td>
      <td><div class="progress-bar"><div class="progress-fill" style="width:${prog}%;background:${progColor}"></div></div><span style="font-size:10px;color:var(--text3)">${prog}%</span></td>
    </tr>`;
  }).join('');
}

function toggleReply(id,val) { const f=getFb(id); f.replied=val; if(val&&f.status==='Pendente') f.status='Respondeu'; feedbacks[id]=f; save(); renderAll(); }

let currentId = null;
function openModal(id) {
  currentId = id;
  const c = contacts.find(x=>x.id===id);
  const f = getFb(id);
  document.getElementById('modalTitle').textContent = c.name;
  document.getElementById('modalBody').innerHTML = `
    <div class="info-bar">
      <div class="info-item"><strong>Canal:</strong> ${c.ch}</div>
      <div class="info-item"><strong>Grupo:</strong> ${c.grp}</div>
      <div class="info-item"><strong>Contato:</strong> ${c.ct}</div>
      <div class="info-item"><a class="link-btn" href="${c.link}" target="_blank">Abrir conversa →</a></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Status do Funil</label><select id="f_status">${statuses.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>NPS (0-10)</label><input type="number" id="f_nps" min="0" max="10" value="${f.nps}" placeholder="0-10"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Experiência Geral</label><select id="f_exp"><option value="">Selecione...</option>${['Excelente','Boa','Regular','Ruim','Ainda não testou'].map(o=>`<option ${f.exp===o?'selected':''}>${o}</option>`).join('')}</select></div>
      <div class="field"><label>Satisfação</label><select id="f_sat"><option value="">Selecione...</option>${['Muito satisfeito','Satisfeito','Neutro','Insatisfeito','Muito insatisfeito'].map(o=>`<option ${f.sat===o?'selected':''}>${o}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>1. Por que quis testar? <small>Motivação</small></label><textarea id="f_q1" placeholder="O que levou essa pessoa a querer testar o Lumyf...">${f.q1}</textarea></div>
    <div class="field"><label>2. Maior problema de gestão financeira <small>Dor principal</small></label><textarea id="f_q2" placeholder="Qual o maior problema que ela enfrenta com gestão financeira...">${f.q2}</textarea></div>
    <div class="field"><label>3. Como acha que o Lumyf pode ajudar?</label><textarea id="f_q3" placeholder="Expectativa sobre como o Lumyf resolve o problema...">${f.q3}</textarea></div>
    <div class="field"><label>5. O que mais gostou?</label><textarea id="f_q5" placeholder="Pontos positivos que destacou...">${f.q5}</textarea></div>
    <div class="field"><label>6. O que NÃO gostou?</label><textarea id="f_q6" placeholder="Pontos negativos, frustrações...">${f.q6}</textarea></div>
    <div class="field"><label>7. Encontrou algum erro/bug? 🐛</label><textarea id="f_q7" placeholder="Descreva o erro, em que tela, o que estava fazendo...">${f.q7}</textarea></div>
    <div class="field"><label>8. O que mudaria?</label><textarea id="f_q8" placeholder="Sugestões de mudança em funcionalidades existentes...">${f.q8}</textarea></div>
    <div class="field"><label>9. O que implementaria?</label><textarea id="f_q9" placeholder="Sugestões de novas funcionalidades...">${f.q9}</textarea></div>
    <div class="field"><label>Observações</label><textarea id="f_obs" placeholder="Anotações livres...">${f.obs}</textarea></div>
  `;
  document.getElementById('overlay').classList.add('open');
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); currentId=null; }

function saveFeedback() {
  if(!currentId) return;
  feedbacks[currentId] = {
    status: document.getElementById('f_status').value,
    replied: getFb(currentId).replied || document.getElementById('f_status').value!=='Pendente',
    nps: document.getElementById('f_nps').value,
    exp: document.getElementById('f_exp').value,
    sat: document.getElementById('f_sat').value,
    q1: document.getElementById('f_q1').value,
    q2: document.getElementById('f_q2').value,
    q3: document.getElementById('f_q3').value,
    q5: document.getElementById('f_q5').value,
    q6: document.getElementById('f_q6').value,
    q7: document.getElementById('f_q7').value,
    q8: document.getElementById('f_q8').value,
    q9: document.getElementById('f_q9').value,
    obs: document.getElementById('f_obs').value,
  };
  if(feedbacks[currentId].status!=='Pendente') feedbacks[currentId].replied=true;
  save();
  closeModal();
  renderAll();
}

function exportCSV() {
  const headers = ['Nome','Canal','Grupo','Contato','Link','Status','Respondeu','Experiência','NPS','Satisfação','1.Por que quis testar','2.Maior problema','3.Como Lumyf ajuda','5.O que gostou','6.O que não gostou','7.Bugs','8.O que mudaria','9.O que implementaria','Observações'];
  const rows = contacts.map(c => {
    const f = getFb(c.id);
    return [c.name,c.ch,c.grp,c.ct,c.link,f.status,f.replied?'Sim':'Não',f.exp,f.nps,f.sat,f.q1,f.q2,f.q3,f.q5,f.q6,f.q7,f.q8,f.q9,f.obs].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(',');
  });
  const csv = '\uFEFF'+headers.join(',')+'\n'+rows.join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='feedbacks_lumyf_beta.csv';
  a.click();
}

function resetAll() {
  if(confirm('Tem certeza que deseja resetar TODOS os feedbacks? Isso não pode ser desfeito.')) {
    feedbacks={};
    save();
    renderAll();
  }
}

function renderAll() { renderStats(); renderFilters(); renderTable(); }
renderAll();

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
</script>
</body>
</html>
